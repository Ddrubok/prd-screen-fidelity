<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shared-style</title><style>*{box-sizing:border-box}body{margin:0;color:#192a35;background:#f5f7f9;font:16px Arial,"Malgun Gothic",sans-serif}h1{font-size:28px;margin:0 0 16px}h2{font-size:20px}button,input{font:inherit}input{padding:10px;border:1px solid #8b9ca7;min-width:0}button{padding:12px 20px;border:0;background:#234f70;color:white;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #ba7500;outline-offset:3px}label{display:block;margin:20px 0 8px}output{display:block;min-height:24px;margin:16px 0}nav{height:64px;padding:20px 32px;background:#dce7ee}main{padding:32px;max-width:700px}input{width:100%}button{margin-top:24px;min-width:160px;padding:14px 24px}p{line-height:1.6}/* STARTER DEFECT */button{padding:4px 8px;min-height:24px}input{height:30px}</style><nav>Field Notes · Preferences</nav><main><h1>Profile</h1><p>Set the name shown in shared spaces.</p><label for="name">Display name</label><input id="name" value="Player One"><button>Save changes</button><output aria-live="polite"></output></main><script>const input=document.querySelector('input');const output=document.querySelector('output');const key='saved-'+location.pathname;input.value=localStorage.getItem(key)??input.value;document.querySelector('button').onclick=()=>{localStorage.setItem(key,input.value);output.textContent='Saved'};</script></html>
